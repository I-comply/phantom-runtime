version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phantom_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_secure_pass}
      POSTGRES_DB: phantomos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - phantom_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phantom_backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-phantom_secure_pass}@postgres:5432/phantomos
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PHANTOM_BOOTSTRAP_ADMIN_KEY: ${PHANTOM_BOOTSTRAP_ADMIN_KEY:?set PHANTOM_BOOTSTRAP_ADMIN_KEY to mint the first admin API key, then unset it}
      # Plugin/strategy code runs via app/core/sandbox.py, not in-process exec(). The
      # default "subprocess" driver (isolated process, unprivileged uid, rlimits — no
      # Docker socket needed) is what this container runs; it blocks fork/exec and
      # privileged-file reads but NOT outbound network from sandboxed code. The
      # stronger "docker" driver (per-call container, --network none) needs direct
      # host Docker access and must NEVER get it by mounting /var/run/docker.sock
      # into this container — that trades sandbox-escape-RCE for host-root-RCE,
      # which is worse. Run SANDBOX_EXECUTOR=docker only on a host where this
      # backend runs outside a container (or has its own, unshared, daemon).
      SANDBOX_EXECUTOR: ${SANDBOX_EXECUTOR:-subprocess}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phantom_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phantom_frontend
    ports:
      - "3000:80"
    environment:
      VITE_BACKEND_URL: http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - phantom_network

volumes:
  postgres_data:

networks:
  phantom_network:
    driver: bridge
