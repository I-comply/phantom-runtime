version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phantom_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_secure_pass}
      POSTGRES_DB: phantomos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - phantom_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phantom_backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-phantom_secure_pass}@postgres:5432/phantomos
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phantom_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phantom_frontend
    ports:
      - "3000:80"
    environment:
      VITE_BACKEND_URL: http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - phantom_network

volumes:
  postgres_data:

networks:
  phantom_network:
    driver: bridge
