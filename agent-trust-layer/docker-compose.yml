# Gateway runs non-root, read-only rootfs, all caps dropped, no Docker socket.
# The worker runs as an rlimit-limited subprocess INSIDE this container (ATL_EXECUTOR=subprocess); the container is
# the boundary. For per-call container isolation (ATL_EXECUTOR=docker) run the gateway on a host with its own
# daemon access, never by mounting docker.sock into this service.
# `internal` has no external route; `edge` exists only to publish 127.0.0.1:8787. Add sidecars (anchor receiver,
# KMS/Vault proxy) to `internal` only.
services:
  atl:
    build: .
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    environment:
      ATL_ADMIN_TOKEN: ${ATL_ADMIN_TOKEN:?set ATL_ADMIN_TOKEN}
      ATL_KEY_PROVIDER: ${ATL_KEY_PROVIDER:-file}
      ATL_MASTER_KEY_HEX: ${ATL_MASTER_KEY_HEX:-}
    volumes: ["atl-data:/data"]
    ports: ["127.0.0.1:8787:8787"]
    networks: [internal, edge]
volumes:
  atl-data:
networks:
  internal:
    internal: true
  edge: {}
