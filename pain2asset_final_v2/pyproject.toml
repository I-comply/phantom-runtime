[project]
name = "pain2asset-forge"
version = "7.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2.14.1",
  "websockets",
  "httpx",
  "python-dotenv",
  "defusedxml",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.vercel]
entrypoint = "api:app"
