rules:
  - id: phantom.java.command-injection
    message: "Runtime.exec / ProcessBuilder with a non-literal command allows command injection."
    severity: ERROR
    languages: [java]
    metadata: {category: security, cwe: ["CWE-78: OS Command Injection"], owasp: ["A03:2021 - Injection"], confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($X, ...)
          - pattern: new ProcessBuilder($X, ...)
      - pattern-not: Runtime.getRuntime().exec("...", ...)
      - pattern-not: new ProcessBuilder("...", ...)

  - id: phantom.java.sql-string-building
    message: "SQL built by concatenation is injectable. Use PreparedStatement with bound parameters."
    severity: ERROR
    languages: [java]
    metadata: {category: security, cwe: ["CWE-89: SQL Injection"], owasp: ["A03:2021 - Injection"], confidence: MEDIUM}
    pattern-either:
      - pattern: $S.executeQuery("..." + $X, ...)
      - pattern: $S.executeUpdate("..." + $X, ...)
      - pattern: $S.execute("..." + $X, ...)
      - pattern: $C.prepareStatement("..." + $X, ...)
      - pattern: $S.executeQuery(String.format(...))
      - pattern: $S.createQuery("..." + $X, ...)
      - pattern: $S.createNativeQuery("..." + $X, ...)

  - id: phantom.java.weak-hash
    message: "Broken message digest algorithm. Use SHA-256+ or a password KDF."
    severity: WARNING
    languages: [java]
    metadata: {category: security, cwe: ["CWE-327: Broken or Risky Cryptographic Algorithm"], owasp: ["A02:2021 - Cryptographic Failures"], confidence: HIGH}
    patterns:
      - pattern: MessageDigest.getInstance($A, ...)
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^"(md2|md4|md5|sha-?1)"$

  - id: phantom.java.weak-cipher
    message: "Weak cipher or ECB mode. Use AES/GCM/NoPadding."
    severity: ERROR
    languages: [java]
    metadata: {category: security, cwe: ["CWE-327: Broken or Risky Cryptographic Algorithm"], owasp: ["A02:2021 - Cryptographic Failures"], confidence: HIGH}
    patterns:
      - pattern: Cipher.getInstance($A, ...)
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^"(des|desede|rc2|rc4|blowfish|aes|aes/ecb/.*|.*/ecb/.*|des/.*)"$

  - id: phantom.java.insecure-random
    message: "java.util.Random is predictable; use SecureRandom for security-sensitive values."
    severity: WARNING
    languages: [java]
    metadata: {category: security, cwe: ["CWE-338: Weak PRNG"], confidence: LOW}
    patterns:
      - pattern-inside: |
          $T $F(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(token|password|secret|key|nonce|salt|otp|session|csrf|reset).*
      - pattern-either:
          - pattern: new Random(...)
          - pattern: Math.random()

  - id: phantom.java.unsafe-deserialization
    message: "ObjectInputStream.readObject on untrusted data enables remote code execution via gadget chains."
    severity: ERROR
    languages: [java]
    metadata: {category: security, cwe: ["CWE-502: Deserialization of Untrusted Data"], owasp: ["A08:2021 - Software and Data Integrity Failures"], confidence: MEDIUM}
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: $O.readObject()
      - pattern: new XMLDecoder(...)

  - id: phantom.java.xxe-factory
    message: "XML parser factory used without disabling DTDs/external entities (XXE)."
    severity: WARNING
    languages: [java]
    metadata: {category: security, cwe: ["CWE-611: XXE"], owasp: ["A05:2021 - Security Misconfiguration"], confidence: LOW}
    pattern-either:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern: SAXParserFactory.newInstance()
      - pattern: XMLInputFactory.newInstance()
      - pattern: TransformerFactory.newInstance()

  - id: phantom.java.trust-all-certs
    message: "TrustManager / HostnameVerifier accepts all certificates or hosts."
    severity: ERROR
    languages: [java]
    metadata: {category: security, cwe: ["CWE-295: Improper Certificate Validation"], owasp: ["A07:2021 - Identification and Authentication Failures"], confidence: HIGH}
    pattern-either:
      - pattern: $B.setHostnameVerifier((...) -> true)
      - pattern: HttpsURLConnection.setDefaultHostnameVerifier((...) -> true)
      - pattern: SSLContext.getInstance("SSL")
      - pattern: new NoopHostnameVerifier()
      - pattern: SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER

  - id: phantom.java.path-traversal
    message: "File path built from a non-literal; validate and canonicalize against a base directory."
    severity: INFO
    languages: [java]
    metadata: {category: security, cwe: ["CWE-22: Path Traversal"], confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: new File($A + $B)
          - pattern: new FileInputStream($A + $B)
          - pattern: Paths.get($A + $B)
      - pattern-not: new File("..." + "...")

  - id: phantom.java.spring-csrf-disabled
    message: "CSRF protection disabled."
    severity: WARNING
    languages: [java]
    metadata: {category: security, cwe: ["CWE-352: CSRF"], owasp: ["A01:2021 - Broken Access Control"], confidence: HIGH}
    pattern-either:
      - pattern: $H.csrf().disable()
      - pattern: $H.csrf(csrf -> csrf.disable())
      - pattern: $H.csrf(AbstractHttpConfigurer::disable)

  - id: phantom.java.log-injection
    message: "Logging a request parameter directly allows log forging; sanitize CR/LF."
    severity: INFO
    languages: [java]
    metadata: {category: security, cwe: ["CWE-117: Improper Output Neutralization for Logs"], confidence: LOW}
    pattern-either:
      - pattern: $L.info($X + $R.getParameter(...))
      - pattern: $L.warn($X + $R.getParameter(...))
      - pattern: $L.error($X + $R.getParameter(...))
