rules:
  - id: phantom.go.command-injection
    message: "exec.Command with a shell and a non-literal command string allows command injection."
    severity: ERROR
    languages: [go]
    metadata: {category: security, cwe: ["CWE-78: OS Command Injection"], owasp: ["A03:2021 - Injection"], confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: exec.Command("sh", "-c", $X, ...)
          - pattern: exec.Command("bash", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "sh", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "bash", "-c", $X, ...)
      - pattern-not: exec.Command("sh", "-c", "...", ...)
      - pattern-not: exec.Command("bash", "-c", "...", ...)

  - id: phantom.go.sql-string-building
    message: "SQL built with fmt.Sprintf or concatenation is injectable. Use placeholders ($1/?) with args."
    severity: ERROR
    languages: [go]
    metadata: {category: security, cwe: ["CWE-89: SQL Injection"], owasp: ["A03:2021 - Injection"], confidence: MEDIUM}
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf(...), ...)
      - pattern: $DB.Exec(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryContext($CTX, fmt.Sprintf(...), ...)
      - pattern: $DB.ExecContext($CTX, fmt.Sprintf(...), ...)
      - pattern: $DB.Query("..." + $X, ...)
      - pattern: $DB.Exec("..." + $X, ...)
      - pattern: $DB.QueryRow("..." + $X, ...)

  - id: phantom.go.tls-insecure-skip-verify
    message: "InsecureSkipVerify disables TLS certificate verification."
    severity: ERROR
    languages: [go]
    metadata: {category: security, cwe: ["CWE-295: Improper Certificate Validation"], owasp: ["A07:2021 - Identification and Authentication Failures"], confidence: HIGH}
    pattern-either:
      - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
      - pattern: $C.InsecureSkipVerify = true

  - id: phantom.go.tls-min-version
    message: "TLS minimum version is below 1.2."
    severity: WARNING
    languages: [go]
    metadata: {category: security, cwe: ["CWE-326: Inadequate Encryption Strength"], confidence: HIGH}
    pattern-either:
      - pattern: "tls.Config{..., MinVersion: tls.VersionTLS10, ...}"
      - pattern: "tls.Config{..., MinVersion: tls.VersionTLS11, ...}"
      - pattern: "tls.Config{..., MinVersion: tls.VersionSSL30, ...}"

  - id: phantom.go.weak-hash
    message: "`$P` is a broken hash for security purposes. Use SHA-256+ or a password KDF (bcrypt/argon2)."
    severity: WARNING
    languages: [go]
    metadata: {category: security, cwe: ["CWE-327: Broken or Risky Cryptographic Algorithm"], owasp: ["A02:2021 - Cryptographic Failures"], confidence: MEDIUM}
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
      - pattern: des.NewCipher(...)
      - pattern: rc4.NewCipher(...)

  - id: phantom.go.math-rand-for-secret
    message: "math/rand is predictable. Use crypto/rand for tokens, keys and nonces."
    severity: WARNING
    languages: [go]
    metadata: {category: security, cwe: ["CWE-338: Weak PRNG"], owasp: ["A02:2021 - Cryptographic Failures"], confidence: LOW}
    patterns:
      - pattern-inside: |
          func $F(...) $R {
            ...
          }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(token|password|secret|key|nonce|salt|otp|session|csrf|reset).*
      - pattern-either:
          - pattern: rand.Int()
          - pattern: rand.Intn(...)
          - pattern: rand.Int63()
          - pattern: rand.Read(...)

  - id: phantom.go.unescaped-html-template
    message: "template.HTML/JS/URL marks data as trusted, bypassing html/template escaping (XSS)."
    severity: WARNING
    languages: [go]
    metadata: {category: security, cwe: ["CWE-79: Cross-site Scripting"], owasp: ["A03:2021 - Injection"], confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: template.HTML($X)
          - pattern: template.JS($X)
          - pattern: template.URL($X)
          - pattern: template.HTMLAttr($X)
      - pattern-not: template.HTML("...")
      - pattern-not: template.JS("...")

  - id: phantom.go.insecure-file-permissions
    message: "Overly permissive file mode."
    severity: WARNING
    languages: [go]
    metadata: {category: security, cwe: ["CWE-732: Incorrect Permission Assignment"], confidence: MEDIUM}
    pattern-either:
      - pattern: os.Chmod($P, 0777)
      - pattern: os.Chmod($P, 0666)
      - pattern: os.MkdirAll($P, 0777)
      - pattern: os.Mkdir($P, 0777)
      - pattern: os.WriteFile($P, $D, 0777)
      - pattern: ioutil.WriteFile($P, $D, 0777)
      - pattern: os.OpenFile($P, $F, 0777)

  - id: phantom.go.http-no-timeout
    message: "http.Server without timeouts is vulnerable to slowloris; ListenAndServe has no timeouts."
    severity: INFO
    languages: [go]
    metadata: {category: reliability, cwe: ["CWE-400: Uncontrolled Resource Consumption"], confidence: MEDIUM}
    pattern-either:
      - pattern: http.ListenAndServe(...)
      - pattern: http.ListenAndServeTLS(...)

  - id: phantom.go.ssrf-http-get
    message: "HTTP request to a non-literal URL; validate against an allowlist if it is influenced by users."
    severity: INFO
    languages: [go]
    metadata: {category: security, cwe: ["CWE-918: SSRF"], confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: http.Get($U)
          - pattern: http.Post($U, ...)
          - pattern: http.NewRequest($M, $U, ...)
      - pattern-not: http.Get("...")
      - pattern-not: http.Post("...", ...)
      - pattern-not: http.NewRequest($M, "...", ...)

  - id: phantom.go.unsafe-pointer
    message: "Use of package unsafe bypasses type and memory safety."
    severity: INFO
    languages: [go]
    metadata: {category: security, cwe: ["CWE-242: Use of Inherently Dangerous Function"], confidence: HIGH}
    pattern-either:
      - pattern: unsafe.Pointer(...)
