name: replaycheck
on:
  push:
    paths: ["replaycheck/**", ".github/workflows/replaycheck.yml"]
  pull_request:
    paths: ["replaycheck/**", ".github/workflows/replaycheck.yml"]
defaults:
  run:
    working-directory: replaycheck
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: ./verify.sh
