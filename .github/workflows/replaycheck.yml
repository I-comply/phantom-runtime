name: replaycheck
on:
  push:
    paths: ["replaycheck/**", ".github/workflows/replaycheck.yml"]
  pull_request:
    paths: ["replaycheck/**", ".github/workflows/replaycheck.yml"]
defaults:
  run:
    working-directory: replaycheck
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python }}" }
      - run: ./verify.sh
