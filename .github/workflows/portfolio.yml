name: portfolio

on:
  push:
    paths: ["portfolio/**", ".github/workflows/portfolio.yml"]
  pull_request:
    paths: ["portfolio/**", ".github/workflows/portfolio.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate asset data (public tier; private tier is not in git)
        run: node scripts/validate-assets.mjs
      - name: Tests (schema, leak, a11y, links, SEO, decks, server, inquiry)
        run: node --test tests/*.test.mjs
      - name: Staging build (no PDFs)
        run: node scripts/build-site.mjs --staging --no-pdf
      - name: Secret-pattern scan of portfolio sources
        run: |
          ! grep -rEn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=private \
            -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{36}' -e '-----BEGIN (RSA |EC )?PRIVATE KEY-----' -e 'sk_live_[A-Za-z0-9]{16,}' .
      - name: Dependency review
        run: |
          # No runtime or dev dependencies: package.json must not declare any.
          node -e "const p=require('./package.json');if(p.dependencies||p.devDependencies){console.error('unexpected dependencies');process.exit(1)}"
