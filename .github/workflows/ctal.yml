name: ctal
on:
  push:
    paths: ["ctal/**", "docs/ctal/**", ".github/workflows/ctal.yml"]
  pull_request:
    paths: ["ctal/**", "docs/ctal/**", ".github/workflows/ctal.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r ctal/requirements.txt jsonschema
      - name: Unit, integration and acceptance tests (AT-01..AT-14)
        env: { CTAL_REQUIRE_NODE: "1" }
        run: python -W error::ResourceWarning -m unittest discover -s ctal/tests -t .
      - name: Secret-pattern scan
        run: python ctal/tools/scan_secrets.py ctal docs/ctal
      - name: End-to-end demo (includes offline export verification and tamper check)
        run: python -m ctal demo
      - name: Dependency inventory
        run: pip freeze > ctal-deps.txt && cat ctal-deps.txt
