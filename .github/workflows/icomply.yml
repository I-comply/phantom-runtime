name: icomply
on:
  push:
    paths: ['icomply/**', '.github/workflows/icomply.yml']
  pull_request:
    paths: ['icomply/**', '.github/workflows/icomply.yml']
defaults:
  run:
    working-directory: icomply
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: icomply/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
