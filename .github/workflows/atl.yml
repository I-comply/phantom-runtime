name: atl
on:
  push:
    paths: ["agent-trust-layer/**", ".github/workflows/atl.yml"]
  pull_request:
    paths: ["agent-trust-layer/**", ".github/workflows/atl.yml"]
defaults:
  run:
    working-directory: agent-trust-layer
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Pull pinned sandbox image (enables Docker executor tests)
        run: docker pull "$(python3 -c 'from atl.executor import DEFAULT_IMAGE as i; print(i)')"
      - run: ./verify.sh
      - run: python3 -m harness.run_agents --tenants 2 --agents 4 --out /tmp/harness
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit
      - run: bandit -r atl -ll
  sbom:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: agent-trust-layer
          format: cyclonedx-json
          output-file: atl-sbom.cdx.json
          artifact-name: atl-sbom.cdx.json
      - run: docker build -t atl-gateway .
      - uses: anchore/sbom-action@v0
        with:
          image: atl-gateway
          format: cyclonedx-json
          output-file: atl-image-sbom.cdx.json
          artifact-name: atl-image-sbom.cdx.json
